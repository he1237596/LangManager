# 前端 Nginx：托管 React SPA + 反向代理 Supabase 服务到同源
#
# 同源好处：
#   1. 浏览器不再跨域，无需 CORS 配置
#   2. /functions/v1/* 统一从本 Nginx 出去，可在此做缓存（解决 i18n CDN 缓存无效问题）
#   3. 对外只暴露一个端口（容器 80），安全

# 上游：kong 网关（已聚合 /rest/v1、/auth/v1）
upstream supabase_gateway {
    server kong:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 静态资源（带长缓存，SPA 资源名带 hash） ----
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Supabase REST / Auth：反代到 kong ----
    location /rest/ {
        proxy_pass http://supabase_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://supabase_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Realtime (WebSocket) ----
    location /realtime/ {
        proxy_pass http://supabase_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 翻译服务（自托管版 translate） ----
    location /translate/ {
        proxy_pass http://supabase_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Edge Functions：反代到 kong，并对 i18n 做 Nginx 层缓存 ----
    # 注意：自托管版没有 Deno Edge Functions，下列仅为"若未来挂载函数网关"预留。
    # 当前 i18n 等接口请在系统设置中改用 /rest/v1 或自建服务。
    location /functions/ {
        # i18n 只读接口缓存 5 分钟（stale-while-revalidate 10 分钟）
        proxy_cache_valid 200 5m;
        proxy_cache_valid any 0s;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_pass http://supabase_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- SPA fallback：所有非资源请求回退到 index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
